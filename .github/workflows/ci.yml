name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so a new validator release that lowers a skill's score shows up.
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Every skill scores A, with an A in Security
        uses: skillland-io/check-action@v1
        with:
          path: skills
          min-score: 90
          min-area-grade: security=A
          validator-version: latest

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Plugin and marketplace files are valid
        run: npx -y @anthropic-ai/claude-code plugin validate --strict .
