name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so a new validator release that lowers a skill's score shows up.
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Every skill scores A
        run: npx -y -p @skillland/validator@0.6.0 skillland check skills --min-score 90

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Plugin and marketplace files are valid
        run: npx -y @anthropic-ai/claude-code plugin validate --strict .
