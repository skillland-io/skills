name: Publish to Tessl

on:
  push:
    branches: [main]
    # Publish only when the manifest changes, since each publish needs a new version.
    paths: [.tessl-plugin/plugin.json]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: tesslio/setup-tessl@v2
        with:
          token: ${{ secrets.TESSL_TOKEN }}
      - run: tessl plugin lint
      - run: tessl plugin publish
